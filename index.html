<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>Sign-up form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="logo">
        <img src="./image/odin-lined.png" alt="" >
        <h2>ODIN</h2>
    </div>
    
    <div class="Signup">
        <p>This is not a real online service! you know you need <br>something like this in your life to help you realize <br> your deepest dreams Sign-up now to get started.</p><br>

        <p> you know you want to.</p><br>

        <form action="#" method="get">
            <p>Let's do this!</p>
            <div>
                <label for="FirstName">FIRST NAME</label><br>
                <input type="text"  name="name" required>
            </div>

            <div>
                <label for="email">EMAIL</label><br>
                <input type="email" name="email" required>
            </div>

            <div>
                <label for="password">PASSWORD</label><br>
                <input type="password" name="password" id="password" required>
            </div>

            

                <div>
                    <label for="lastname">LAST NAME</label><br>
                    <input type="text" name="lastname" required>
                </div>
               
                <div>
                    <label for="phoneNO">PHONE NUMBERS</label><br>
                    <input type="numbers" required>
                </div>

                <div>
                   <label for="confirm password">CONFIRM PASSWORD</label><br>
                  <input type="password" name="password" id="password" required>
                </div>
                 
        </form>


        <button>Create Account</button>
            
        <p>Already have an account? <a href="log in">log in</a></p>
    </div>
    
    
</body>
</html>
