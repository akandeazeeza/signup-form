<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>Sign-up form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="logo">
        <img src="./image/odin-lined.png" alt="" >
        <h2>ODIN</h2>
    </div>
    
    <div class="Signup">
        <p>This is not a real online service! you know you need <br>something like this in your life to help you realize <br> your deepest dreams Sign-up now to get started.</p><br>

        <p> you know you want to.</p><br>

        <form action="#" method="get">
            <p>Let's do this!</p>
           <div class="container">
               <div>
                  <label for="FirstName">FIRST NAME</label><br>
                  <input type="text"  name="name"  placeholder="FirstName">
              </div>

                <div>
                  <label for="lastname">LAST-NAME</label><br>
                  <input type="lastname" name="lastname" placeholder="lastname" required>
               </div>
           </div>
               
           <div class="container1">
               <div>
                   <label for="email">EMAIL</label><br>
                  <input type="text" name="email" placeholder="myname@example.com" required>
               </div>

              <div>
                 <label for="password">PASSWORD</label><br>
                 <input type="text" name="text" required>
               </div>
            </div>

            <div class="container2">
                <div>
                  <label for="phoneNO">PHONE NUMBERS</label><br>
                    <input type="numbers" placeholder="0123456789" required>
                </div>

                <div>
                  <label for="confirm password">CONFIRM PASSWORD</label><br>
                  <input type="text" name="text" id="password" required>
                </div>
            </div>
                 
        </form>


        <button id="btn">Create Account</button>
        <p id="demo"></p>
            
        <p>Already have an account? <a href="log in">log in</a></p>
    </div>
    
    
</body>
<script>
    const btn = document.getElementById("btn");
    btn.addEventListener("click", () => {
        document.getElementById("demo").innerHTML = "THANK YOU! <br> Your submission has been received! ";
    })
</script>
</html>
